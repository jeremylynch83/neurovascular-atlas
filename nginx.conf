server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_vary on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json model/gltf-binary application/octet-stream image/svg+xml;
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /anatomy/manifest.json { add_header Cache-Control "no-cache"; }
    location ~ \.glb$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
