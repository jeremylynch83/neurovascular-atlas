server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_vary on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json model/gltf-binary application/octet-stream image/svg+xml;
    location / { try_files $uri $uri/ =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /anatomy/manifest.json { add_header Cache-Control "no-cache"; }
    location ^~ /anatomy/viewer/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ ^/anatomy/(dsa-flow|dsa-surfaces)\.json$ {
        # These requests carry the release; unversioned requests revalidate.
        set $atlas_cache "no-cache";
        if ($arg_v != "") { set $atlas_cache "public, max-age=31536000, immutable"; }
        add_header Cache-Control $atlas_cache;
    }
    location ~ \.glb$ {
        set $atlas_cache "no-cache";
        if ($arg_v != "") { set $atlas_cache "public, max-age=31536000, immutable"; }
        add_header Cache-Control $atlas_cache;
    }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
