<!doctype html><html><head><meta charset="utf-8"><title>Brainstem fitting review</title>
<style>body{margin:0;background:#fff;font:16px Arial;color:#223044}main{display:grid;grid-template-columns:1fr 1fr;width:1400px}section{height:560px}h2{font-size:18px;margin:15px 20px}canvas{width:700px;height:510px;display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script></head>
<body><main id="views"></main><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';
const loader=new GLTFLoader();
const keys=['vein.anterior_medullary','vein.anterior_pontine','vein.anterior_pontomesencephalic','vein.anterior_spinal','vein.posterior_communicating','vein.transverse_pontine.left','vein.transverse_pontine.right','vein.pontomedullary.left','vein.pontomedullary.right','vein.superior_petrosal_vein.left','vein.superior_petrosal_vein.right','vein.cerebellopontine_fissure.left','vein.cerebellopontine_fissure.right','vein.lateral_mesencephalic.left','vein.lateral_mesencephalic.right','vein.basal.left','vein.basal.right','vein.basilar_plexus'];
const [oldBrain,newBrain,oldVeins,newVeins]=await Promise.all(['/public/anatomy/models/brain-context.glb','/.authoring/coherent-veins22/brain-trial.glb','/.authoring/brainstem19/veins-baseline.glb','/.authoring/coherent-veins22/veins-trial.glb'].map(p=>loader.loadAsync(p)));
const cameras=[['Right lateral',[1,0,0]],['Anterior',[0,1,0]],['Oblique',[.8,1,.3]]];
const normalise=n=>n.replace(/[._]/g,'');
for(const [name,direction] of cameras)for(const [state,brain,veins] of [['v0.9.19',oldBrain,oldVeins],['Unaccepted size and vein trial',newBrain,newVeins]]){
 const section=document.createElement('section');section.innerHTML=`<h2>${name}: ${state}</h2>`;document.querySelector('main').append(section);
 const scene=new THREE.Scene();scene.background=new THREE.Color('#f9fafb');
 const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(700,510);renderer.setPixelRatio(1);section.append(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(150,200,300);scene.add(light);
 brain.scene.traverse(o=>{if(o.isMesh&&/brain(pons|midbrain|medulla-oblongata|base-of-peduncle|superior-cerebellar-peduncle)/.test(normalise(o.name))){const m=o.clone();m.material=new THREE.MeshStandardMaterial({color:0xc9beaa,transparent:true,opacity:.6,depthWrite:false,side:THREE.DoubleSide,roughness:.8});scene.add(m);}});
 veins.scene.traverse(o=>{if(o.isMesh&&keys.map(normalise).includes(normalise(o.name))){const m=o.clone();m.material=new THREE.MeshStandardMaterial({color:normalise(o.name)===normalise('vein.basilar_plexus')?0x825bc4:0x21649b,roughness:.4});scene.add(m);}});
 if(scene.children.length<10)throw new Error('Anatomical review mesh selection failed');
 const aspect=700/510,scale=54;const camera=new THREE.OrthographicCamera(-scale*aspect,scale*aspect,scale,-scale,.1,2000);const centre=new THREE.Vector3(0,-70,51);camera.up.set(0,0,1);camera.position.copy(centre).add(new THREE.Vector3(...direction).normalize().multiplyScalar(400));camera.lookAt(centre);renderer.render(scene,camera);
}
window.reviewReady=true;
</script></body></html>
