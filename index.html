<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111317" />
  <meta name="description" content="Explore interactive 3D neurovascular anatomy for neurointervention and interventional neuroradiology. Created by Jeremy Lynch and Sean McIlhone." />
  <meta name="author" content="Jeremy Lynch, Sean McIlhone" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <title>Neurovascular Atlas | 3D Anatomy for Neurointervention</title>
  <link rel="canonical" href="%ATLAS_SITE_URL%" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_GB" />
  <meta property="og:site_name" content="Neurovascular Atlas" />
  <meta property="og:title" content="Neurovascular Atlas | 3D Anatomy for Neurointervention" />
  <meta property="og:description" content="Interactive neurovascular anatomy for interventional neuroradiology education. By Jeremy Lynch and Sean McIlhone." />
  <meta property="og:url" content="%ATLAS_SITE_URL%" />
  <meta property="og:image" content="%ATLAS_SITE_URL%social-preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Neurovascular Atlas: interactive 3D anatomy, by Jeremy Lynch and Sean McIlhone" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  <link rel="preload" href="%BASE_URL%anatomy/%ATLAS_CATALOGUE%" as="fetch" type="application/json" crossorigin />
  <style>
    .atlas-fallback{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;overflow:auto;box-sizing:border-box;padding:24px 16px;background:#111317;color:#f0eee8;font:14px/1.6 'Inter Tight',system-ui,sans-serif;color-scheme:dark;-webkit-font-smoothing:antialiased}
    .atlas-fallback[hidden]{display:none!important}.atlas-fallback-card{box-sizing:border-box;width:100%;max-width:640px;flex:0 0 auto;margin:auto;padding:clamp(24px,5vw,40px);background:rgba(27,29,34,.94);border:1px solid rgba(245,242,235,.14);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.36)}
    .atlas-fallback h1{font:600 clamp(28px,5vw,34px)/1.1 'Source Serif 4 Variable',Georgia,serif;letter-spacing:-.02em;margin:0 0 16px}.atlas-fallback p{margin:0 0 14px}.atlas-intro-tagline{font-size:15px;color:#f0eee8}.atlas-intro-copy{color:#aaa7a0}.atlas-fallback a{color:#99a4ff;text-underline-offset:3px}.atlas-fallback a:focus-visible{outline:2px solid #99a4ff;outline-offset:4px}
    .atlas-startup{border-top:1px solid rgba(245,242,235,.14);margin-top:26px;padding-top:20px}.atlas-startup #atlas-startup-status{font-weight:500;font-size:13px;margin:0 0 12px}.atlas-startup-meter{display:grid;grid-template-columns:minmax(0,1fr) 40px;align-items:center;gap:12px}.atlas-startup progress{display:block;appearance:none;box-sizing:border-box;width:100%;height:6px;margin:0;overflow:hidden;border:0;border-radius:3px;background:rgba(245,242,235,.07);accent-color:#99a4ff}.atlas-startup progress::-webkit-progress-bar{background:rgba(245,242,235,.07);border-radius:3px}.atlas-startup progress::-webkit-progress-value{background:#99a4ff;border-radius:3px}.atlas-startup progress::-moz-progress-bar{background:#99a4ff;border-radius:3px}.atlas-startup output{color:#aaa7a0;text-align:right;font:11px/1.4 'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}.atlas-startup [hidden]{display:none!important}.atlas-startup-retry{display:inline-block;padding:7px 14px;border:1px solid rgba(245,242,235,.14);border-radius:6px;background:#1c1f24;text-decoration:none;font-size:13px}.atlas-startup-retry:hover{background:rgba(245,242,235,.07)}.atlas-fallback noscript p{margin:12px 0 0;color:#aaa7a0}
  </style>
</head>
<body>
  <main id="atlas-fallback" class="atlas-fallback" aria-labelledby="atlas-fallback-title">
    <div class="atlas-fallback-card">
      <h1 id="atlas-fallback-title">Neurovascular Atlas</h1>
      <div class="atlas-explanation">%ATLAS_EXPLANATION%</div>
      <div class="atlas-startup" data-nosnippet>
        <p id="atlas-startup-status" role="status" aria-live="polite">Loading 3D anatomy…</p>
        <div id="atlas-startup-meter" class="atlas-startup-meter">
          <progress id="atlas-startup-progress" value="0" max="100" aria-label="Loading anatomy"></progress>
          <output id="atlas-startup-percent" for="atlas-startup-progress" aria-hidden="true">0%</output>
        </div>
        <a id="atlas-startup-retry" class="atlas-startup-retry" href="" hidden>Retry loading</a>
        <noscript><style>#atlas-startup-status,#atlas-startup-meter{display:none!important}</style><p>The interactive 3D viewer requires JavaScript and WebGL.</p></noscript>
      </div>
    </div>
  </main>
  <div id="root" inert aria-hidden="true"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
